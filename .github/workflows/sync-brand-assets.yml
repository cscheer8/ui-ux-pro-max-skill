name: Sync Brand Assets

on:
  push:
    branches:
      - 'feat/brand-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate mirrored assets
        run: node cli/scripts/sync-assets.mjs

      - name: Commit synchronized assets
        run: |
          if git diff --quiet; then
            echo "Assets already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/assets .claude/skills/ui-ux-pro-max
          git commit -m "chore: synchronize generated brand assets"
          git push origin HEAD:${{ github.ref_name }}
