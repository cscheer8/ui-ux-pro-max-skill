name: Fix stale shadcn test

on:
  push:
    branches:
      - feat/brand-system

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/brand-system
          fetch-depth: 0

      - name: Align test with pinned fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('.claude/skills/ui-styling/scripts/tests/test_shadcn_add.py'),
              Path('cli/assets/skills/ui-styling/scripts/tests/test_shadcn_add.py'),
          ]
          old = 'assert call_args[:3] == ["npx", "shadcn@latest", "add"]'
          new = 'assert call_args[:3] == ["npx", "shadcn@2.3.0", "add"]'
          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected stale assertion not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/ui-styling/scripts/tests/test_shadcn_add.py cli/assets/skills/ui-styling/scripts/tests/test_shadcn_add.py
          git commit -m "test: align shadcn expectation with pinned fallback"
          git push origin HEAD:feat/brand-system
