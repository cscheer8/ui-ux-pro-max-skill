name: Brand System CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/brand-system

permissions:
  contents: read

jobs:
  brand-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CSV data
        run: python scripts/validate-csv.py

      - name: Run brand system smoke tests
        run: python scripts/test-brand-system.py

      - name: Run brand audit smoke tests
        run: python scripts/test-brand-audit.py

      - name: Run complete package smoke test
        run: python scripts/test-release-workflow.py

      - name: Run executed image generation smoke test
        run: python scripts/test-image-execution.py

      - name: Run logo and icon system smoke test
        run: python scripts/test-logo-icon-system.py

      - name: Run corporate identity and banner smoke test
        run: python scripts/test-corporate-identity.py

      - name: Run enterprise token architecture smoke test
        run: python scripts/test-enterprise-tokens.py

      - name: Validate Version 1.0 release metadata
        run: python scripts/test-release-v1.py

      - name: Compile Python modules
        run: |
          python -m py_compile src/ui-ux-pro-max/scripts/core.py
          python -m py_compile src/ui-ux-pro-max/scripts/design_system.py
          python -m py_compile src/ui-ux-pro-max/scripts/brand_system.py
          python -m py_compile src/ui-ux-pro-max/scripts/brand_audit.py
          python -m py_compile src/ui-ux-pro-max/scripts/token_exports.py
          python -m py_compile src/ui-ux-pro-max/scripts/presentation_system.py
          python -m py_compile src/ui-ux-pro-max/scripts/image_execution.py
          python -m py_compile src/ui-ux-pro-max/scripts/logo_icon_system.py
          python -m py_compile src/ui-ux-pro-max/scripts/export_identity.py
          python -m py_compile src/ui-ux-pro-max/scripts/corporate_identity.py
          python -m py_compile src/ui-ux-pro-max/scripts/export_corporate_identity.py
          python -m py_compile src/ui-ux-pro-max/scripts/enterprise_tokens.py
          python -m py_compile src/ui-ux-pro-max/scripts/export_enterprise_tokens.py
          python -m py_compile src/ui-ux-pro-max/scripts/search.py
